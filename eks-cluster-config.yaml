apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: fitness-tracker-cluster
  region: ap-south-2

managedNodeGroups:
  - name: fitness-tracker-workers
    instanceType: c7i-flex.large
    desiredCapacity: 4
    minSize: 4
    maxSize: 5
    volumeSize: 30
    volumeType: gp3
    labels: { role: worker }
    tags:
      Environment: Production
      Project: Fitness-Tracker
